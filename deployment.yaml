apiVersion: apps/v1
kind: Deployment
metadata:
  name: week12-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: week12-app
  template:
    metadata:
      labels:
        app: week12-app
    spec:
      containers:
        - name: week12-app
          image: khyathig/week12-app:latest
          ports:
            - containerPort: 5000
          imagePullPolicy: Always